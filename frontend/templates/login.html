<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shadow C2 — Login</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0a0a0f; color: #e0e0e0; font-family: 'Segoe UI', system-ui, sans-serif;
               display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .login-container { background: #12121a; border: 1px solid #1e1e2e; border-radius: 12px;
                          padding: 40px; width: 380px; box-shadow: 0 20px 60px rgba(0,0,0,0.5); }
        .login-header { text-align: center; margin-bottom: 30px; }
        .login-header h1 { font-size: 28px; color: #00ff88; margin-bottom: 5px; }
        .login-header p { color: #666; font-size: 13px; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 6px; font-size: 13px; color: #888; text-transform: uppercase; letter-spacing: 1px; }
        .form-group input { width: 100%; padding: 12px 16px; background: #1a1a2e; border: 1px solid #2a2a3e;
                           border-radius: 8px; color: #fff; font-size: 15px; outline: none; transition: border 0.2s; }
        .form-group input:focus { border-color: #00ff88; }
        .login-btn { width: 100%; padding: 14px; background: linear-gradient(135deg, #00ff88, #00cc6a);
                    border: none; border-radius: 8px; color: #000; font-size: 16px; font-weight: 700;
                    cursor: pointer; transition: transform 0.1s, box-shadow 0.2s; text-transform: uppercase; letter-spacing: 2px; }
        .login-btn:hover { transform: translateY(-1px); box-shadow: 0 4px 20px rgba(0,255,136,0.3); }
        .login-btn:active { transform: translateY(0); }
        .error-msg { background: rgba(255,50,50,0.1); border: 1px solid rgba(255,50,50,0.3);
                    color: #ff5555; padding: 10px 14px; border-radius: 6px; margin-bottom: 20px; font-size: 13px; text-align: center; }
        .skull { font-size: 48px; display: block; margin-bottom: 10px; }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <span class="skull">☠️</span>
            <h1>Shadow C2</h1>
            <p>Command & Control Center</p>
        </div>
        {% if error %}
        <div class="error-msg">{{ error }}</div>
        {% endif %}
        <form method="POST" action="{{ url_for('dashboard.login') }}">
            <div class="form-group">
                <label>Username</label>
                <input type="text" name="username" placeholder="operator" autofocus required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" placeholder="••••••••" required>
            </div>
            <button type="submit" class="login-btn">Access</button>
        </form>
    </div>
</body>
</html>
